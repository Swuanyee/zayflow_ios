name: ZayFlow
options:
  bundleIdPrefix: com.zayflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ZayFlowCore:
    path: ZayFlowCore
  GRDB:
    path: Vendor/GRDB.swift
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  ZayFlow:
    type: application
    platform: iOS
    sources:
      - path: ZayFlow
    dependencies:
      - package: ZayFlowCore
        product: ZayFlowCore
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zayflow.pos
        PRODUCT_NAME: ZayFlow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ZayFlow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_NSCameraUsageDescription: ZayFlow uses the camera to scan product barcodes.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ZayFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZayFlowTests
    dependencies:
      - target: ZayFlow
      - package: ZayFlowCore
        product: ZayFlowCore
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zayflow.pos.tests
        GENERATE_INFOPLIST_FILE: YES
  ZayFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZayFlowUITests
    dependencies:
      - target: ZayFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zayflow.pos.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ZayFlow:
    build:
      targets:
        ZayFlow: all
        ZayFlowTests: [test]
        ZayFlowUITests: [test]
    test:
      targets:
        - ZayFlowTests
        - ZayFlowUITests
